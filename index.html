<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WrapBack</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <style>
    body {
      background-color: #08090c;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .wrapped-year-badge {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      -webkit-text-stroke: 2.4px #000000;
      color: #FF3020;
    }

    .hypnotic-circles {
      background: repeating-radial-gradient(
        circle at 85% 30%,
        #000000 0,
        #000000 13px,
        #ffffff 14px,
        #ffffff 26px
      );
    }

    .aurora-2024 {
      background:
        radial-gradient(circle at 50% 20%, #0044ff 0%, #00f0ff 35%, transparent 70%),
        radial-gradient(circle at 80% 40%, #7000ff 0%, transparent 50%),
        #050508;
    }

    .liquid-glass-2026 {
      background:
        radial-gradient(circle at 15% 25%, rgba(99, 102, 241, 0.4) 0%, transparent 55%),
        radial-gradient(circle at 85% 35%, rgba(236, 72, 153, 0.35) 0%, transparent 55%),
        radial-gradient(circle at 50% 85%, rgba(20, 184, 166, 0.3) 0%, transparent 55%),
        #0b0c12;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-8 px-4">

  <header class="text-center mb-6 max-w-xl px-2">
    <h1 class="text-4xl sm:text-5xl font-black tracking-tight text-white">
      WRAP<span class="text-emerald-400">BACK</span>
    </h1>
    <p class="text-xs sm:text-sm text-neutral-400 mt-1 text-balance">
      Upload your Spotify listening history and revisit your stats in the style of past years.
    </p>
  </header>

  <div id="dropZone" class="w-full max-w-md bg-neutral-900/90 border-2 border-dashed border-neutral-700 hover:border-emerald-400 rounded-3xl p-6 text-center transition-all cursor-pointer mb-6 shadow-2xl">
    <input id="fileInput" type="file" accept=".json" multiple class="hidden" />
    <div class="w-12 h-12 bg-neutral-800 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3">
      📂
    </div>
    <h2 class="text-base font-bold text-white mb-1">Drop your JSON files here</h2>
    <p class="text-xs text-neutral-400 max-w-xs mx-auto mb-4">
      Files named <code class="text-emerald-400 bg-black/60 px-1 py-0.5 rounded">Streaming_History_Audio_*.json</code>
    </p>
    <button class="bg-emerald-400 hover:bg-emerald-300 text-black font-extrabold text-xs px-5 py-2.5 rounded-full shadow-lg pointer-events-none">
      Select from your device
    </button>
  </div>

  <div id="yearSelectionContainer" class="hidden w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-4 mb-6 text-center shadow-xl">
    <p class="text-xs font-bold text-neutral-400 mb-2.5">2. Click a year to update the design and stats:</p>
    <div id="yearsPills" class="flex flex-wrap items-center justify-center gap-2"></div>
  </div>

  <div id="resultSection" class="hidden flex flex-col items-center">
    <div id="wrappedCard" class="w-[340px] sm:w-[360px] h-[640px] rounded-[32px] overflow-hidden shadow-2xl relative select-none"></div>

    <button id="btnDownload" class="mt-6 bg-emerald-400 hover:bg-emerald-300 text-black font-black text-sm px-8 py-3 rounded-full flex items-center gap-2 shadow-2xl transition-transform active:scale-95">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
      </svg>
      Download Card for Instagram Stories (PNG)
    </button>
  </div>

  <script>
    let rawRecords = [];
    let selectedYears = new Set();
    let renderVersion = 0;

    const artistImageCache = {};

    const defaultPlaceholder = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
        <rect width="600" height="600" fill="#15171e"/>
        <circle cx="300" cy="240" r="110" fill="#262936"/>
        <path d="M120 530c30-130 100-170 180-170s150 40 180 170" fill="#262936"/>
      </svg>
    `)}`;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const yearSelectionContainer = document.getElementById('yearSelectionContainer');
    const yearsPills = document.getElementById('yearsPills');
    const resultSection = document.getElementById('resultSection');
    const wrappedCard = document.getElementById('wrappedCard');
    const btnDownload = document.getElementById('btnDownload');

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-emerald-400', 'bg-neutral-800');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-emerald-400', 'bg-neutral-800');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-emerald-400', 'bg-neutral-800');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFiles(e.target.files);
    });

    async function handleFiles(files) {
      rawRecords = [];
      renderVersion++;

      for (const file of Array.from(files)) {
        try {
          const text = await file.text();
          const json = JSON.parse(text);

          if (!Array.isArray(json)) continue;

          json.forEach(item => {
            const track = item.trackName || item.master_metadata_track_name;
            const artist = item.artistName || item.master_metadata_album_artist_name;
            const ms = item.msPlayed ?? item.ms_played ?? 0;
            const dateStr = item.endTime || item.ts;

            if (!track || !artist || !dateStr) return;

            const normalizedDate = String(dateStr).includes('T')
              ? String(dateStr)
              : String(dateStr).replace(' ', 'T');

            const parsedDate = new Date(normalizedDate);

            if (!isNaN(parsedDate.getTime())) {
              rawRecords.push({
                track: String(track),
                artist: String(artist),
                msPlayed: Number(ms) || 0,
                date: parsedDate
              });
            }
          });
        } catch (err) {
          console.error(err);
        }
      }

      if (!rawRecords.length) {
        alert("No valid streaming data found.");
        return;
      }

      setupYearsMenu();
    }

    function setupYearsMenu() {
      const detectedYears = [
        ...new Set(rawRecords.map(r => r.date.getFullYear()))
      ].sort((a, b) => b - a);

      yearsPills.innerHTML = '';
      selectedYears.clear();
      selectedYears.add(detectedYears[0]);

      detectedYears.forEach(year => {
        const btn = document.createElement('button');

        btn.textContent = year;
        btn.dataset.year = year;

        updatePillStyle(
          btn,
          selectedYears.has(year) && selectedYears.size === 1
        );

        btn.addEventListener('click', () => {
          selectedYears.clear();
          selectedYears.add(year);
          refreshPillsUI(detectedYears);
          renderActiveWrapped();
        });

        yearsPills.appendChild(btn);
      });

      if (detectedYears.length > 1) {
        const allBtn = document.createElement('button');

        allBtn.textContent = "All Years";
        allBtn.dataset.year = "ALL";

        updatePillStyle(
          allBtn,
          selectedYears.size === detectedYears.length
        );

        allBtn.addEventListener('click', () => {
          selectedYears = new Set(detectedYears);
          refreshPillsUI(detectedYears);
          renderActiveWrapped();
        });

        yearsPills.appendChild(allBtn);
      }

      yearSelectionContainer.classList.remove('hidden');
      resultSection.classList.remove('hidden');

      renderActiveWrapped();
    }

    function updatePillStyle(btn, isActive) {
      btn.className = isActive
        ? "px-4 py-2 rounded-full text-xs font-black bg-emerald-400 text-black shadow-md transition-all scale-105"
        : "px-4 py-2 rounded-full text-xs font-bold bg-black text-neutral-400 hover:text-white border border-neutral-800 transition-all";
    }

    function refreshPillsUI(detectedYears) {
      yearsPills.querySelectorAll('button').forEach(btn => {
        if (btn.dataset.year === "ALL") {
          updatePillStyle(
            btn,
            selectedYears.size === detectedYears.length
          );
        } else {
          const year = Number(btn.dataset.year);

          updatePillStyle(
            btn,
            selectedYears.has(year) && selectedYears.size === 1
          );
        }
      });
    }

    async function renderActiveWrapped() {
      const currentVersion = ++renderVersion;

      const yearsArr = Array.from(selectedYears).sort((a, b) => a - b);
      const isSingleYear = yearsArr.length === 1;
      const singleYear = isSingleYear ? yearsArr[0] : null;

      let filteredRecords = rawRecords.filter(
        r => selectedYears.has(r.date.getFullYear())
      );

      if (isSingleYear) {
        const isModern = singleYear >= 2023;
        const cutoffMonth = isModern ? 10 : 9;
        const cutoffDay =
          singleYear >= 2024
            ? 25
            : singleYear === 2023
              ? 18
              : 31;

        const cutoff = new Date(
          singleYear,
          cutoffMonth,
          cutoffDay,
          23,
          59,
          59,
          999
        );

        const withCutoff = filteredRecords.filter(r => r.date <= cutoff);

        if (withCutoff.length >= 5) {
          filteredRecords = withCutoff;
        }
      }

      let totalMs = 0;

      filteredRecords.forEach(r => {
        totalMs += r.msPlayed;
      });

      const totalMinutes = Math.round(totalMs / 60000).toLocaleString('en-US');

      const validStreams = filteredRecords.filter(
        r => r.msPlayed >= 30000
      );

      const streamSource =
        validStreams.length >= 5
          ? validStreams
          : filteredRecords;

      const artistCounts = {};
      const trackCounts = {};

      streamSource.forEach(r => {
        artistCounts[r.artist] = (artistCounts[r.artist] || 0) + 1;
        trackCounts[r.track] = (trackCounts[r.track] || 0) + 1;
      });

      const topArtists = Object.entries(artistCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(a => a[0]);

      const topTracks = Object.entries(trackCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(t => t[0]);

      let deducedGenre = "Pop";
      let primaryArtistImg = defaultPlaceholder;

      try {
        deducedGenre = await deduceGenre(topArtists, topTracks);
      } catch (e) {
        deducedGenre = "Pop";
      }

      if (currentVersion !== renderVersion) return;

      if (topArtists.length) {
        try {
          primaryArtistImg = await getArtistImage(topArtists[0]);
        } catch (e) {
          primaryArtistImg = defaultPlaceholder;
        }
      }

      if (currentVersion !== renderVersion) return;

      if (singleYear === 2019) {
        render2019Template(topArtists, topTracks, totalMinutes, deducedGenre, primaryArtistImg);
      } else if (singleYear === 2020) {
        render2020Template(topArtists, topTracks, totalMinutes, deducedGenre, primaryArtistImg);
      } else if (singleYear === 2021) {
        render2021Template(topArtists, topTracks, totalMinutes, deducedGenre, primaryArtistImg);
      } else if (singleYear === 2022) {
        render2022Template(topArtists, topTracks, totalMinutes, deducedGenre, primaryArtistImg);
      } else if (singleYear === 2023) {
        render2023Template(topArtists, topTracks, totalMinutes, deducedGenre, primaryArtistImg);
      } else if (singleYear === 2024) {
        render2024Template(topArtists, topTracks, totalMinutes, primaryArtistImg);
      } else if (singleYear === 2026) {
        render2026Template(topArtists, topTracks, totalMinutes, deducedGenre, primaryArtistImg);
      } else {
        const yearLabel = isSingleYear
          ? singleYear
          : yearsArr.length === 2
            ? `${yearsArr[0].toString().slice(2)}-${yearsArr[1].toString().slice(2)}`
            : "ALL";

        render2025FallbackTemplate(
          topArtists,
          topTracks,
          totalMinutes,
          deducedGenre,
          primaryArtistImg,
          yearLabel
        );
      }
    }

    function imageHTML(src, classes = "") {
      const safeSrc = src || defaultPlaceholder;
      return `
        <img
          src="${safeSrc}"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"
          class="${classes}"
          onerror="this.onerror=null;this.src='${defaultPlaceholder}'"
          alt=""
        >
      `;
    }

    function render2019Template(artists, tracks, minutes, genre, artistImg) {
      wrappedCard.className = "w-[340px] sm:w-[360px] h-[640px] bg-[#FF007F] text-black rounded-[32px] p-6 flex flex-col justify-between overflow-hidden shadow-2xl relative select-none border-4 border-black";

      wrappedCard.innerHTML = `
        <div>
          <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-1.5 text-[#CCFF00] font-black text-xs tracking-wider">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M4 10v4h2v-4H4zm4-3v10h2V7H8zm4-4v18h2V3h-2zm4 4v10h2V7h-2zm4 3v4h2v-4h-2z"/>
              </svg>
              <span>WrapBack</span>
            </div>
            <span class="text-xs font-black tracking-widest text-[#CCFF00]">2019 WRAPPED</span>
          </div>

          <div class="relative h-44 mb-3 overflow-hidden flex items-center">
            <div class="absolute left-0 w-36 h-36 border-2 border-black z-40 shadow-md overflow-hidden bg-black">
              ${imageHTML(artistImg, "w-full h-full object-cover")}
            </div>
            <div class="absolute left-14 w-32 h-32 border-2 border-black z-30 shadow-md overflow-hidden bg-black">
              ${imageHTML(artistImg, "w-full h-full object-cover")}
            </div>
            <div class="absolute left-28 w-28 h-28 border-2 border-black z-20 shadow-md overflow-hidden bg-black">
              ${imageHTML(artistImg, "w-full h-full object-cover")}
            </div>
            <div class="absolute left-40 w-24 h-24 border-2 border-black z-10 shadow-md overflow-hidden bg-black">
              ${imageHTML(artistImg, "w-full h-full object-cover")}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
              <p class="text-xs uppercase font-black text-[#CCFF00] mb-1.5 tracking-wider">TOP ARTISTS</p>
              <ul class="space-y-1 text-xs font-black text-black">
                ${artists.map(a => `<li class="truncate">${escapeHTML(a)}</li>`).join('')}
              </ul>
            </div>
            <div>
              <p class="text-xs uppercase font-black text-[#CCFF00] mb-1.5 tracking-wider">TOP SONGS</p>
              <ul class="space-y-1 text-xs font-black text-black">
                ${tracks.map(t => `<li class="truncate">${escapeHTML(t)}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>

        <div>
          <div class="grid grid-cols-2 gap-3 pt-3 border-t-2 border-black/20 mb-3">
            <div>
              <p class="text-[10px] uppercase font-black text-[#CCFF00] tracking-wider">MINUTES LISTENED</p>
              <p class="text-2xl font-black text-black tracking-tight leading-tight">${minutes}</p>
            </div>
            <div>
              <p class="text-[10px] uppercase font-black text-[#CCFF00] tracking-wider">TOP GENRE</p>
              <p class="text-xl font-black text-black truncate tracking-tight leading-tight">${escapeHTML(genre)}</p>
            </div>
          </div>

          <div class="text-right">
            <span class="text-[10px] font-black tracking-widest text-[#CCFF00]">DADDESA.GITHUB.IO/WRAPBACK</span>
          </div>
        </div>
      `;
    }

    function render2020Template(artists, tracks, minutes, genre, artistImg) {
      wrappedCard.className = "w-[340px] sm:w-[360px] h-[640px] bg-gradient-to-b from-[#2B00FF] via-[#8400FF] to-[#FF5E00] p-3 rounded-[32px] overflow-hidden shadow-2xl relative select-none border-4 border-black";

      wrappedCard.innerHTML = `
        <div class="w-full h-full bg-[#1C00D6] rounded-[24px] p-5 flex flex-col justify-between relative overflow-hidden text-white">

          <div class="relative mx-auto mt-2 w-44 h-44">
            <div class="absolute inset-0 bg-yellow-300 transform -rotate-3 rounded-lg opacity-80"></div>
            <div class="absolute inset-0 bg-cyan-400 transform rotate-2 rounded-lg opacity-80"></div>
            <div class="relative w-full h-full bg-black rounded-lg overflow-hidden border-2 border-white shadow-xl">
              ${imageHTML(artistImg, "w-full h-full object-cover")}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 text-xs font-black mt-2">
            <div>
              <p class="text-[10px] text-neutral-300 uppercase tracking-wider mb-1">Top Artists</p>
              <ol class="space-y-1">
                ${artists.map((a, i) => `<li class="truncate"><span class="text-neutral-400 mr-1.5">${i + 1}</span>${escapeHTML(a)}</li>`).join('')}
              </ol>
            </div>

            <div>
              <p class="text-[10px] text-neutral-300 uppercase tracking-wider mb-1">Top Songs</p>
              <ol class="space-y-1">
                ${tracks.map((t, i) => `<li class="truncate"><span class="text-neutral-400 mr-1.5">${i + 1}</span>${escapeHTML(t)}</li>`).join('')}
              </ol>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 pt-2 border-t border-white/20">
            <div>
              <p class="text-[9px] uppercase tracking-wider text-neutral-300">Minutes Listened</p>
              <p class="text-xl font-black text-white">${minutes}</p>
            </div>
            <div>
              <p class="text-[9px] uppercase tracking-wider text-neutral-300">Top Genre</p>
              <p class="text-base font-black text-white truncate">${escapeHTML(genre)}</p>
            </div>
          </div>

          <div class="-mx-5 -mb-5 bg-[#B2FF00] text-black px-4 py-2.5 flex justify-between items-center font-black text-xs">
            <div class="flex items-center gap-1.5">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M4 10v4h2v-4H4zm4-3v10h2V7H8zm4-4v18h2V3h-2zm4 4v10h2V7h-2zm4 3v4h2v-4h-2z"/>
              </svg>
              <span>WrapBack</span>
            </div>
            <span>#2020WRAPBACK</span>
          </div>

        </div>
      `;
    }

    function render2021Template(artists, tracks, minutes, genre, artistImg) {
      wrappedCard.className = "w-[340px] sm:w-[360px] h-[640px] bg-gradient-to-tr from-[#3B00ED] via-[#FF007A] to-[#FF8A00] p-3 rounded-[32px] overflow-hidden shadow-2xl relative select-none border-4 border-black";

      wrappedCard.innerHTML = `
        <div class="w-full h-full bg-[#1A0033]/90 backdrop-blur-md rounded-[24px] p-5 flex flex-col justify-between relative overflow-hidden text-white">

          <div class="relative mx-auto mt-2 w-44 h-44 flex items-center justify-center">
            <div class="absolute inset-y-0 -inset-x-3 flex justify-between items-center opacity-80 pointer-events-none">
              <div class="w-2.5 h-36 bg-gradient-to-b from-yellow-400 via-pink-500 to-cyan-400 rounded-full blur-[1px]"></div>
              <div class="w-2.5 h-36 bg-gradient-to-b from-cyan-400 via-pink-500 to-yellow-400 rounded-full blur-[1px]"></div>
            </div>
            <div class="relative w-full h-full bg-black rounded-xl overflow-hidden border border-white/30 shadow-2xl">
              ${imageHTML(artistImg, "w-full h-full object-cover")}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 text-xs font-black mt-2">
            <div>
              <p class="text-[10px] text-neutral-400 uppercase tracking-wider mb-1">Top Artists</p>
              <ol class="space-y-1">
                ${artists.map((a, i) => `<li class="truncate"><span class="text-neutral-500 mr-1.5">${i + 1}</span>${escapeHTML(a)}</li>`).join('')}
              </ol>
            </div>

            <div>
              <p class="text-[10px] text-neutral-400 uppercase tracking-wider mb-1">Top Songs</p>
              <ol class="space-y-1">
                ${tracks.map((t, i) => `<li class="truncate"><span class="text-neutral-500 mr-1.5">${i + 1}</span>${escapeHTML(t)}</li>`).join('')}
              </ol>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 pt-2 border-t border-white/10">
            <div>
              <p class="text-[9px] uppercase tracking-wider text-neutral-400">Minutes Listened</p>
              <p class="text-xl font-black text-white">${minutes}</p>
            </div>
            <div>
              <p class="text-[9px] uppercase tracking-wider text-neutral-400">Top Genre</p>
              <p class="text-base font-black text-white truncate">${escapeHTML(genre)}</p>
            </div>
          </div>

          <div class="-mx-5 -mb-5 bg-gradient-to-r from-[#FF007A] to-[#7000FF] text-white px-4 py-2.5 flex justify-between items-center font-black text-xs">
            <div class="flex items-center gap-1.5">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M4 10v4h2v-4H4zm4-3v10h2V7H8zm4-4v18h2V3h-2zm4 4v10h2V7h-2zm4 3v4h2v-4h-2z"/>
              </svg>
              <span>WrapBack</span>
            </div>
            <span>#2021WRAPBACK</span>
          </div>

        </div>
      `;
    }

    function render2022Template(artists, tracks, minutes, genre, artistImg) {
      wrappedCard.className = "w-[340px] sm:w-[360px] h-[640px] bg-[#0E0E10] text-[#E4FF1A] rounded-[32px] p-5 flex flex-col justify-between overflow-hidden shadow-2xl relative select-none border-4 border-black";

      wrappedCard.innerHTML = `
        <div class="relative w-full flex flex-col items-center">
          <div class="relative w-56 h-56 flex items-center justify-center">
            <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 200 200">
              <g transform="translate(100,100)">
                <circle cx="-45" cy="-45" r="45" fill="#6B11D4" />
                <circle cx="45" cy="-45" r="45" fill="#6B11D4" />
                <circle cx="-45" cy="45" r="45" fill="#6B11D4" />

    function fetchArtistAvatarDeezer(artistName) {
      return new Promise((resolve) => {
        const callbackName = 'dz_cb_' + Math.random().toString(36).substring(2, 10);
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          cleanup();
          resolve(null);
        }, 4000);

        function cleanup() {
          clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = (res) => {
          cleanup();
          if (res && res.data && res.data.length > 0) {
            const target = artistName.toLowerCase().trim();
            const exact = res.data.find(a => a.name && a.name.toLowerCase().trim() === target) || res.data[0];
            const pic = exact.picture_xl || exact.picture_big || exact.picture_medium;
            resolve(pic || null);
          } else {
            resolve(null);
          }
        };

        script.src = `https://api.deezer.com/search/artist?q=${encodeURIComponent(artistName)}&output=jsonp&callback=${callbackName}`;
        script.onerror = () => { cleanup(); resolve(null); };
        document.body.appendChild(script);
      });
    }

    async function getArtistImage(artistName) {
      if (!artistName) return defaultPlaceholder;

      const cleanName = artistName.trim();
      if (artistImageCache[cleanName]) {
        return artistImageCache[cleanName];
      }

      const lower = cleanName.toLowerCase();
      const aliases = {
        "tha supreme": "thasup",
        "thasup": "thasup"
      };

      const queryName = aliases[lower] || cleanName;

      try {
        const avatarUrl = await fetchArtistAvatarDeezer(queryName);
        if (avatarUrl) {
          const imgRes = await fetch(avatarUrl, { mode: 'cors' });
          if (imgRes.ok) {
            const blob = await imgRes.blob();
            if (blob.type.startsWith('image/')) {
              const dataUrl = await blobToDataURL(blob);
              artistImageCache[cleanName] = dataUrl;
              return dataUrl;
            }
          }
        }
      } catch (e) {}

      try {
        const query = encodeURIComponent(queryName);
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=album&country=IT&limit=10`, { mode: 'cors' });
        if (res.ok) {
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            const target = queryName.toLowerCase();
            const match = data.results.find(item => {
              const a = (item.artistName || "").toLowerCase();
              return a === target || a.includes(target) || target.includes(a);
            }) || data.results[0];

            if (match && match.artworkUrl100) {
              const hqUrl = match.artworkUrl100.replace('100x100bb', '600x600bb');
              const imgRes = await fetch(hqUrl, { mode: 'cors' });
              if (imgRes.ok) {
                const blob = await imgRes.blob();
                const dataUrl = await blobToDataURL(blob);
                artistImageCache[cleanName] = dataUrl;
                return dataUrl;
              }
            }
          }
        }
      } catch (e) {}

      artistImageCache[cleanName] = defaultPlaceholder;
      return defaultPlaceholder;
    }

    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;

        reader.readAsDataURL(blob);
      });
    }

    async function deduceGenre(artists, tracks) {
      const topArtist = artists[0]?.toLowerCase() || "";

      const dict = {
        "bad bunny": "Latin Urban",
        "karol g": "Latin Urban",
        "harry styles": "Pop",
        "fred again..": "Disco House",
        "daft punk": "Disco House",
        "frah quintale": "Italian Pop",
        "green day": "Punk Rock",
        "carl brave": "Indie Pop",
        "tha supreme": "Italian Hip Hop",
        "thasup": "Italian Hip Hop",
        "gemitaiz": "Italian Hip Hop",
        "madman": "Italian Hip Hop",
        "liberato": "Electronic",
        "gomma": "Post-Punk",
        "fabri fibra": "Italian Hip Hop",
        "pippo sowlo": "Italian Rap"
      };

      if (dict[topArtist]) return dict[topArtist];

      if (!artists.length) return "Pop";

      try {
        const query = encodeURIComponent(
          `${artists[0]} ${tracks[0] || ""}`
        );

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5000);

        const res = await fetch(
          `https://itunes.apple.com/search?term=${query}&entity=song&country=IT&limit=3`,
          {
            signal: controller.signal,
            mode: 'cors'
          }
        );

        clearTimeout(timeout);

        if (!res.ok) return "Pop";

        const data = await res.json();

        if (data.results && data.results.length) {
          let genre = data.results[0].primaryGenreName;

          if (genre === "Latin") return "Latin Urban";
          if (genre === "Electronic" || genre === "Dance") return "Disco House";
          if (genre === "Alternative") return "Indie Pop";

          return genre || "Pop";
        }
      } catch (e) {}

      return "Pop";
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    btnDownload.addEventListener('click', async () => {

          }
        );

        a.click();
      } catch (err) {

        alert("Error saving image");
      } finally {

      }
    });
